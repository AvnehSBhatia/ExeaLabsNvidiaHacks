name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The portable gate skips only checks that need an OpenGL context. The rendering
# job runs the full suite and demo with a probed Linux software backend.
jobs:
  test:
    name: portable (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,sim]"
      - name: Tests without a graphics context
        run: python -m pytest -q -p no:cacheprovider --no-render -rs
      - name: Demo dataset
        run: python -m arrival demo --episodes 2
      - name: Validate
        run: python -m arrival validate out/datasets/hero_kitchen

  render:
    name: rendering (Linux, py${{ matrix.python-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2, 3]  # whole test files split by measured time (tests/conftest.py, tests/shard_weights.json)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for headless MuJoCo rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libosmesa6
      - name: Install
        run: python -m pip install -e ".[dev,sim]"
      - name: Probe rendering backends
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.demo_all import preflight
          why = preflight()
          if why:
              raise SystemExit(why)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key in ("MUJOCO_GL", "PYOPENGL_PLATFORM"):
                  if key in os.environ:
                      stream.write(f"{key}={os.environ[key]}\n")
      - name: Full suite with rendering, one third of the test files
        # one job ran past the 75-minute limit even with pytest-xdist; three shards, each split over the CPUs
        env:
          ARRIVAL_TEST_SHARD: ${{ matrix.shard }}/3
        run: python -m pytest -q -p no:cacheprovider -n auto
      - name: Offline one-command demo (same as make demo)
        if: matrix.shard == 1
        run: python scripts/demo_all.py --quick --out out/demo --timeout 600
      - name: Upload demo summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-linux-py${{ matrix.python-version }}
          path: |
            out/demo/demo_summary.md
            out/demo/demo_summary.json
            out/demo/index.html
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,lint]"
      - name: Ruff (syntax errors and undefined names)
        run: ruff check .
      - name: Docs check (commands parse, paths and labels agree)
        run: python scripts/check_docs.py
      - name: Markdown links (relative links and anchors)
        run: python scripts/check_links.py

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build tools
        run: python -m pip install setuptools
      - name: Build sdist and wheel, install the wheel in a fresh venv, run it from another directory
        run: python scripts/smoke_package.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the CPU image
        run: docker build -t arrival-ci .
      - name: Run it
        run: docker run --rm arrival-ci python -m arrival validate --help
